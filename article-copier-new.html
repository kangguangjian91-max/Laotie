<script>
const articleContent = `Steel is non-combustible, but it loses strength rapidly when exposed to high temperatures. At around 540°C (1000°F), structural steel can lose over 50% of its yield strength — enough to cause catastrophic collapse in a fire. That is why fire protection is a mandatory consideration in any steel structure design.

This guide covers the most common fire protection methods for steel buildings, their advantages, and how to choose the right approach for your project.

1. Understanding Fire Ratings for Steel Structures

Building codes typically require structural steel to maintain its load-bearing capacity for a specified period during a fire — commonly 60, 90, or 120 minutes. This is known as the Fire Resistance Level (FRL) or fire rating.

Fire Rating	Typical Application	Required Protection
R 30 (30 min)	Storage sheds, small workshops	Minimal — intumescent coating often sufficient
R 60 (60 min)	Warehouses, commercial buildings	Standard — board or spray protection common
R 90 (90 min)	Multi-story buildings, schools	Moderate — thicker coatings or dual systems
R 120 (120 min)	High-rise, critical infrastructure	Heavy — concrete encasement or composite

2. Intumescent Coatings (Thin-Film)

Intumescent paint is the most popular fire protection method for visible steelwork. When exposed to heat, it expands to up to 50 times its original thickness, forming a char layer that insulates the steel.

● Advantages: Aesthetic — you can still see the steel profile; lightweight; easy to apply on site.
● Disadvantages: Higher cost per square metre; requires proper surface preparation; limited durability in outdoor or high-humidity environments.
● Best suited for: Exposed steel in office buildings, shopping centers, and architectural structures.

3. Spray-Applied Fireproofing (SFRM)

Sprayed Fire-Resistive Material (SFRM) — often called "fireproofing spray" — is a cementitious or mineral-fiber coating applied directly to steel surfaces.

● Advantages: Cost-effective for large areas; fast application; excellent thermal insulation.
● Disadvantages: Rough texture, not visually appealing; can produce dust during application; adds noticeable thickness.
● Best suited for: Concealed steelwork — roof trusses, ceiling cavities, industrial plant structures.

4. Board Systems (Fire-Rated Cladding)

Fire-rated boards — such as calcium silicate or gypsum-based panels — are fixed around steel members to create a protective enclosure.

● Advantages: Dry installation, no curing time; predictable thickness per fire rating; clean finish.
● Disadvantages: Labour-intensive for complex connections; adds dead load; takes up space around columns and beams.
● Best suited for: Columns and beams in enclosed spaces, stairwells, and lift shafts.

5. Concrete Encasement and Composite Systems

Full concrete encasement provides the highest level of fire protection. The concrete mass absorbs heat and delays temperature rise in the steel.

● Advantages: Very high fire resistance (up to 240 minutes); durable and impact-resistant; no maintenance required.
● Disadvantages: Heavy — adds significant dead load; hides the steel completely; labour and formwork costs are high.
● Best suited for: Basement columns, fire-rated walls in multi-story buildings, critical infrastructure.

6. Intumescent wraps, blankets, and mats

For irregularly shaped members or retrofit projects, flexible fire-protective wraps and ceramic fiber blankets offer a practical alternative.

● Advantages: Flexible — wraps around complex geometries; no surface preparation needed; removable for inspection.
● Disadvantages: Less aesthetically pleasing; lower impact resistance; may require mechanical fastening.
● Best suited for: Cable trays, pipe supports, bracing in existing buildings.

How to Choose the Right Method

Consider these factors when selecting a fire protection system:

● Fire rating required by local code — this is the primary constraint.
● Visibility of the steel — exposed steel needs aesthetics (intumescent); concealed steel can use spray or boards.
● Budget — intumescent is premium; SFRM is budget-friendly for large areas.
● Construction timeline — spray and intumescent need curing time; boards are dry-install.
● Environmental conditions — outdoor or corrosive environments require tested systems with topcoats.

Conclusion

Fire protection is not optional — it is a critical safety and compliance requirement for every steel building. The right method depends on your project's fire rating target, budget, and aesthetic needs. Consulting a structural engineer early in the design phase ensures you select a system that is both effective and cost-efficient.

Visit Laotie Steel Structure: https://www.laotie-steel.com`;

// Convert plain text with simple formatting to HTML
function renderContent(text) {
  const blocks = text.split(/\n\n+/);
  let html = '';
  for (const block of blocks) {
    const trimmed = block.trim();
    if (!trimmed) continue;

    // Check if it's a table (has tab characters as separators)
    if (trimmed.includes('\t') && trimmed.split('\n').length >= 2) {
      const rows = trimmed.split('\n');
      let tableHtml = '<table>\n';
      for (let i = 0; i < rows.length; i++) {
        const cells = rows[i].split('\t');
        const tag = i === 0 ? 'th' : 'td';
        tableHtml += '<tr>';
        for (const cell of cells) {
          tableHtml += `<${tag}>${cell.trim()}</${tag}>`;
        }
        tableHtml += '</tr>\n';
      }
      tableHtml += '</table>';
      html += tableHtml + '\n';
      continue;
    }

    // Check for numbered list heading (lines starting with digit. followed by text on same line)
    if (/^\d+[\.\)]\s+/.test(trimmed) && !trimmed.includes('\n')) {
      const match = trimmed.match(/^(\d+[\.\)])\s+(.*)/);
      if (match) {
        html += `<h3>${match[1]} ${match[2]}</h3>\n`;
        continue;
      }
    }
    // Check for heading (lines starting with digit. followed by text)
    if (/^\d+[\.\)]\s+[A-Z]/.test(trimmed) && !trimmed.includes('\n')) {
      const match = trimmed.match(/^(\d+[\.\)])\s+(.*)/);
      if (match) {
        html += `<h3>${match[1]} ${match[2]}</h3>\n`;
        continue;
      }
    }

    // Check for bullet list
    if (/^[●\-•]\s/.test(trimmed)) {
      const lines = trimmed.split('\n');
      let listHtml = '<ul>\n';
      for (const line of lines) {
        const clean = line.replace(/^[●\-•\s]+/, '');
        if (clean.includes('→')) {
          const parts = clean.split('→');
          listHtml += `<li><strong>${parts[0].trim()}</strong> → ${parts[1].trim()}</li>\n`;
        } else {
          listHtml += `<li>${clean}</li>\n`;
        }
      }
      listHtml += '</ul>';
      html += listHtml + '\n';
      continue;
    }

    // Check for long numbered list (multi-line, starts with digit.)
    if (/^\d+[\.\)]\s/.test(trimmed)) {
      const lines = trimmed.split('\n');
      const allLinesAreItems = lines.every(l => /^\s*\d+[\.\)]\s/.test(l) || /^[●\-•]\s/.test(l) || /^\s*$/.test(l));
      if (allLinesAreItems) {
        let listHtml = '<ol>\n';
        for (const line of lines) {
          if (/^\s*$/.test(line)) continue;
          const clean = line.replace(/^\d+[\.\)]\s*/, '').replace(/^[●\-•\s]+/, '');
          listHtml += `<li>${clean}</li>\n`;
        }
        listHtml += '</ol>';
        html += listHtml + '\n';
        continue;
      }
    }

    // Regular paragraph with bold text
    const formatted = trimmed.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html += `<p>${formatted}</p>\n`;
  }
  return html;
}

document.getElementById('contentDisplay').innerHTML = renderContent(articleContent);

function copyTitle() {
  const title = document.getElementById('titleDisplay').textContent.trim();
  navigator.clipboard.writeText(title).then(() => {
    showToast('✅ Title copied!');
    flashBtn('copyTitleBtn');
  }).catch(() => fallbackCopy(title, 'copyTitleBtn', '✅ Title copied!'));
}

function copyContent() {
  const text = articleContent.trim();
  navigator.clipboard.writeText(text).then(() => {
    showToast('✅ Content copied!');
    flashBtn('copyContentBtn');
  }).catch(() => fallbackCopy(text, 'copyContentBtn', '✅ Content copied!'));
}

function flashBtn(id) {
  const btn = document.getElementById(id);
  btn.classList.add('copied');
  btn.textContent = '✓ Copied!';
  setTimeout(() => {
    btn.classList.remove('copied');
    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy ' + (id === 'copyTitleBtn' ? 'Title' : 'Content');
  }, 2000);
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function fallbackCopy(text, btnId, successMsg) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.left = '-9999px';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showToast(successMsg);
    flashBtn(btnId);
  } catch {
    showToast('❌ Copy failed, please select text manually');
  }
  document.body.removeChild(textarea);
}
</script>
